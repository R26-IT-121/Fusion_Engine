# DeepSentinel configuration
#
# Copy to config.ini and edit. config.ini is gitignored.
#
# Every value here can be overridden by an environment variable, which always
# wins. That is how cloud deploys work: the image ships this file, and the
# platform injects secrets and environment-specific URLs as env vars.
#
#   Precedence:  environment variable  >  config.ini  >  built-in default
#
# The env var name for each setting is listed in the comment above it.


[paths]
# CHROMA_DB_PATH — vector store for the FATF knowledge base.
# Rebuilt automatically on startup, safe to delete.
chroma_db = ./chroma_store

# FATF_DATA_PATH — source typologies the knowledge base is built from.
fatf_data = ./data/fatf_typologies.json

# MODEL_SAVE_PATH — trained fusion meta-classifier.
meta_classifier = ./models/meta_classifier.joblib

# USERS_FILE — user database. Contains bcrypt password hashes; never commit.
users_db = ./users.json

# SETTINGS_FILE — risk managers and alert thresholds, written at runtime.
runtime_settings = ./settings.json


[upstream]
# Base URLs for the three upstream model APIs. The adapters in
# backend/adapters/upstream.py append each model's own path.
#
# If an upstream API is unreachable, its score is imputed as 0.5 and the
# fusion engine applies a confidence penalty rather than failing the request.

# BEHAVIORAL_API_BASE — M1 Wijesinghe, VAE/DSAA
#   -> POST {base}/api/v1/behavioral/classify
behavioral_api_base = http://localhost:8001

# GRAPH_API_BASE — M2 Ewaduge, Edge-Enhanced GraphSAGE
#   -> POST {base}/api/graph/analyze
graph_api_base = http://localhost:8002

# TEMPORAL_API_BASE — M3 Pathirana, TCN/TSCFD
#   -> POST {base}/api/v1/classify
temporal_api_base = http://localhost:8003

# UPSTREAM_TIMEOUT_MS — per-call timeout. Raise if a model is slow to respond;
# real inference needs considerably more than the 500 ms a mock does.
timeout_ms = 5000


[llm]
# LLM_PROVIDER — gemini | ollama
provider = gemini

# GEMINI_MODEL
# Google retires model names — gemini-2.0-flash now returns NotFound, which
# surfaces as "Report generation failed". List what your key can actually call:
#   python -c "import google.generativeai as g; g.configure(api_key='KEY'); \
#     print([m.name for m in g.list_models() if 'generateContent' in m.supported_generation_methods])"
# Prefer a pinned stable release over *-latest, which can change under you.
gemini_model = gemini-2.5-flash

# OLLAMA_BASE_URL / OLLAMA_MODEL — only used when provider = ollama
ollama_base_url = http://localhost:11434
ollama_model = llama3


[database]
# DATABASE_URL — where users, risk managers, analysis history and the audit
# log live.
#
# The SQLite default needs no setup but is a file on ONE machine: accounts
# created here do not exist anywhere else. For multiple people or devices you
# need Postgres.
#
#   url = sqlite+aiosqlite:///./deepsentinel.db          local only
#   url = postgresql+asyncpg://user:pass@host/dbname     shared
#
# Free cloud Postgres — Neon (neon.tech): no credit card, does not expire or
# sleep. Create a project, copy the connection string, paste it below. The
# plain postgresql:// form from the dashboard is accepted and upgraded to the
# async driver automatically, and ?sslmode=require is handled.
#
# In production set DATABASE_URL as an environment variable instead of writing
# the password here.
url = sqlite+aiosqlite:///./deepsentinel.db

# Connection pool (Postgres only; ignored for SQLite)
pool_size = 5
max_overflow = 10

# Log every SQL statement. Debugging only — very noisy.
echo_sql = false


[auth]
# ACCESS_TOKEN_EXPIRE_MINUTES — session lifetime. 480 = 8 hours, which matches
# a working shift. Shorten for higher-security deployments.
access_token_expire_minutes = 480

# Failed sign-in attempts before an account locks, and for how long.
max_failed_logins = 5
lockout_minutes = 15

# CORS_ORIGINS — which browser origins may call this API.
# '*' is development only. A deployment that accepts bearer tokens should name
# its frontend origin, otherwise any page on the internet can call this API
# using a signed-in user's token.
#   cors_origins = https://deepsentinel.example.com,https://staging.example.com
cors_origins = *


[email]
# Sending mail requires an identity to send FROM. Configure ONE of the two
# options below. With neither set, nothing is sent and the API says so rather
# than reporting a false success.
#
# ── Option 1: SMTP (simplest, works immediately) ────────────────────────────
# Use a DEDICATED account, never a personal one. For Gmail:
#   1. Create or pick the sending account
#   2. Turn on 2-Step Verification (app passwords are unavailable without it)
#   3. Visit https://myaccount.google.com/apppasswords and generate one
#   4. Put the account address in [secrets] smtp_username and the 16-character
#      app password in [secrets] smtp_password (spaces are fine)
#
# An app password is scoped and independently revocable — treat it like an API
# key. Gmail allows roughly 500 recipients a day, ample for a demo.
smtp_host =
smtp_port = 587
smtp_use_tls = true

# ── Option 2: SendGrid (better deliverability at volume) ────────────────────
# Put the key in [secrets] sendgrid_api_key. The sender_email below must be
# verified at https://app.sendgrid.com/settings/sender_auth or sends return 403.
# Used only when smtp_host is blank.

# SENDER_EMAIL — the From address. For SMTP the sending account address is used
# instead, since providers reject a From that does not match the authenticated
# account.
sender_email = alerts@deepsentinel.io

# SENDER_NAME — display name on the alert.
sender_name = DeepSentinel Fraud Alerts


# ─────────────────────────────────────────────────────────────────────────────
# [secrets]
#
# For LOCAL DEVELOPMENT ONLY.
#
# In production, leave this section empty and inject these through your
# platform's secret manager as environment variables:
#
#     JWT_SECRET_KEY, GEMINI_API_KEY, SENDGRID_API_KEY,
#     ADMIN_BOOTSTRAP_PASSWORD
#
# Environment variables override anything written here, so a production image
# can ship with this section blank and still be fully configured at runtime.
# ─────────────────────────────────────────────────────────────────────────────
[secrets]
# JWT_SECRET_KEY — signing key for session tokens. REQUIRED in production.
# Generate one with:
#     python -c "import secrets; print(secrets.token_urlsafe(32))"
# If unset, an ephemeral key is generated at startup and every session is
# invalidated on restart.
jwt_secret_key =

# ADMIN_BOOTSTRAP_PASSWORD — password for the admin account created on first
# run, when users_db does not yet exist. Change it after first login.
admin_bootstrap_password = admin123

# GEMINI_API_KEY — https://aistudio.google.com/app/apikey
gemini_api_key =

# SENDGRID_API_KEY — https://app.sendgrid.com/settings/api_keys
# Used only when [email] smtp_host is blank.
sendgrid_api_key =

# SMTP credentials for the dedicated sending account. See the [email] section
# for how to obtain an app password.
smtp_username =
smtp_password =
