[project]
name = "deepsentinel"
version = "1.0.0"
description = "Multi-modal AI fusion engine for explainable financial fraud detection"
authors = [{ name = "DeepSentinel Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # --- API framework ---
    "fastapi (>=0.115,<0.140)",
    "uvicorn[standard] (>=0.32,<0.50)",

    # --- Async HTTP (upstream model APIs + SendGrid REST) ---
    "httpx (>=0.27,<0.29)",

    # --- ML / fusion meta-classifier ---
    "scikit-learn (>=1.5,<2.0)",
    "numpy (>=1.26,<3.0)",
    "joblib (>=1.4,<2.0)",

    # --- RAG: vector store + embeddings ---
    "chromadb (>=0.5,<2.0)",
    "sentence-transformers (>=3.3,<6.0)",

    # --- LLM ---
    # google-genai, not google-generativeai: the latter is discontinued.
    "google-genai (>=1.0,<2.0)",

    # --- Auth & security ---
    "pyjwt (>=2.8,<3.0)",
    "bcrypt (>=4.1,<6.0)",
    "email-validator (>=2.1,<3.0)",
    "python-multipart (>=0.0.9,<0.1)",

    # --- Config ---
    "python-dotenv (>=1.0,<2.0)",
    "pydantic (>=2.10,<3.0)",

    # --- Database ---
    # Not optional. backend.auth, backend.settings, backend.sar and every
    # backend.db module import sqlalchemy at module scope, so the app cannot
    # even be imported without it. Both drivers are core for the same reason:
    # aiosqlite backs the default DATABASE_URL, and asyncpg backs the shared
    # Postgres every install is expected to point at.
    "sqlalchemy (>=2.0,<3.0)",
    "aiosqlite (>=0.20,<1.0)",
    "asyncpg (>=0.29,<0.32)",

    # --- Batch upload ---
    # Imported lazily by backend.batch. Without it .xlsx uploads are refused
    # with a clear message, which is a graceful failure of a shipped feature
    # rather than an acceptable default.
    "openpyxl (>=3.1,<4.0)",

    # --- Alert email subgraph diagram ---
    # Guarded by an ImportError in monitor.alert_render, so its absence costs
    # the picture rather than the email. The picture is the point of the alert,
    # so it is declared.
    "pillow (>=10.0,<14.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.8"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests
