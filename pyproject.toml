[project]
name = "deepsentinel"
version = "1.0.0"
description = "Multi-modal AI fusion engine for explainable financial fraud detection"
authors = [{ name = "DeepSentinel Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # --- API framework ---
    "fastapi (>=0.115,<0.140)",
    "uvicorn[standard] (>=0.32,<0.50)",

    # --- Async HTTP (upstream model APIs + SendGrid REST) ---
    "httpx (>=0.27,<0.29)",

    # --- ML / fusion meta-classifier ---
    "scikit-learn (>=1.5,<2.0)",
    "numpy (>=1.26,<3.0)",
    "joblib (>=1.4,<2.0)",

    # --- RAG: vector store + embeddings ---
    "chromadb (>=0.5,<2.0)",
    "sentence-transformers (>=3.3,<6.0)",

    # --- LLM ---
    # google-genai, not google-generativeai: the latter is discontinued.
    "google-genai (>=1.0,<2.0)",

    # --- Auth & security ---
    "pyjwt (>=2.8,<3.0)",
    "bcrypt (>=4.1,<6.0)",
    "email-validator (>=2.1,<3.0)",
    "python-multipart (>=0.0.9,<0.1)",

    # --- Config ---
    "python-dotenv (>=1.0,<2.0)",
    "pydantic (>=2.10,<3.0)",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy (>=2.0,<3.0)",
    "asyncpg (>=0.29,<0.31)",
    "alembic (>=1.13,<2.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.8"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests
